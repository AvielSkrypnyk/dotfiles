name: Release

'on':
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs outside the release queue, so an old commit can't replace a newer pending release.
  check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.main.outputs.current }}
    steps:
      - name: Check main has not advanced
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$MAIN_SHA" = "$CHECKED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.current == 'true'
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create release token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Main may have advanced while this job waited; that newer run releases instead.
      - name: Check main has not advanced
        id: main
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse origin/main)" = "$CHECKED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare version and changelog
        if: steps.main.outputs.current == 'true'
        id: version
        run: python .github/scripts/release.py

      - name: Commit, tag, and publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "$VERSION"
          # Both refs advance together; a concurrent main push rejects both.
          git push --atomic origin HEAD:main "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
